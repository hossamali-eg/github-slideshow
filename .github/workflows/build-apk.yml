name: Build WiFi Manager APK

on:
  push:
    branches:
      - claude/android-wifi-manager-f3klst
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install required SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('WifiManager/**/*.gradle*', 'WifiManager/**/*.kts') }}
          restore-keys: gradle-

      - name: Generate Gradle wrapper
        working-directory: WifiManager
        run: gradle wrapper --gradle-version=8.4

      - name: Build Debug APK
        working-directory: WifiManager
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFiManager-debug-apk
          path: WifiManager/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Print APK size
        run: |
          echo "✅ Build complete!"
          find WifiManager/app/build/outputs -name "*.apk" -exec ls -lh {} \;
