name: Build WiFi Manager APK

on:
  push:
    branches:
      - claude/android-wifi-manager-f3klst
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install required SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('WifiManager/**/*.gradle*', 'WifiManager/**/*.kts') }}
          restore-keys: gradle-

      - name: Generate Gradle wrapper
        working-directory: WifiManager
        run: gradle wrapper --gradle-version=8.4

      - name: Generate signing keystore
        working-directory: WifiManager/app
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -alias wifimanager \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=WiFiManager, OU=App, O=WiFiManager, L=Cairo, S=Cairo, C=EG" \
            -storepass WifiManager2024 -keypass WifiManager2024

      - name: Build Release APK
        working-directory: WifiManager
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFiManager-release-apk
          path: WifiManager/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: WiFiManager - Latest Build
          body: |
            تطبيق WiFi Manager للتحكم في راوتر ZTE ZXHN H188A
            آخر إصدار مبني تلقائياً.
          files: WifiManager/app/build/outputs/apk/release/app-release.apk
          prerelease: false
          make_latest: true

      - name: Print APK size
        run: |
          echo "✅ Build complete!"
          find WifiManager/app/build/outputs -name "*.apk" -exec ls -lh {} \;
